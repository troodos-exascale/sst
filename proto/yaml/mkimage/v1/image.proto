syntax = "proto3";

package sst.yaml.mkimage.v1;

option go_package = "github.com/troodos-exascale/sst/proto/yaml/mkimage/v1;mkimagepb";

// ============================================================================
// Top-level image document
// ============================================================================

message ImageYAML {
   string api_version = 1; // "sst.io/v1"
   string kind        = 2; // "Image"
   
   Provenance provenance = 3;
   StoragePlan storage = 4;
   BootStructure boot = 5;
}

message Provenance {
   string name = 1;              // The human-readable repository/directory name
   string build_id = 2;          // Local hash/timestamp of the compilation
   string upstream_os = 3;       // Semantic name from /etc/os-release (ID-VERSION-VARIANT)
   string source_url = 4;        // Upstream registry/download URL
   string retrieved_at = 5;      // UTC Timestamp of artifact retrieval
   string local_sha256 = 6;      // Checksum of the primary artifact
   string upstream_build_id = 7; // BUILD_ID from /etc/os-release
}

message StoragePlan {
   string raw_image = 1;         // Filename of the block device (e.g., image.raw)
   string format = 2;            // raw, qcow2, etc.
   
   string rootfs_part_uuid = 3;
   string rootfs_device = 4;
   string rootfs_uuid = 5;
   string rootfs_type = 6;
   string rootfs_size = 7;
   bool rootfs_is_last = 8;
}

message BootStructure {
   string kernel = 1;            // Filename of the extracted uncompressed kernel
   string initrd = 2;            // Filename of the initramfs
   
   string bootfs_part_uuid = 3;
   string bootfs_device = 4;
   string bootfs_uuid = 5;
   string bootfs_type = 6;
   bool bootfs_is_last = 7;
}

