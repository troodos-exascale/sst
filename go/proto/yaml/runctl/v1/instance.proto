syntax = "proto3";

package sst.yaml.runctl.v1;

option go_package = "github.com/swiss-software-tool/runtime-smart/go/proto/yaml/runctl/v1;runctlpb";

message Instance {
  string api_version = 1; // "sst.io/v1"
  string kind        = 2; // "Instance"
  string name = 3;
  bool gui =4;
  string cpu_count = 5;
  string memory_size =  6;
  string memory_size_suffix = 7;
  repeated string disk = 8;
  repeated string rwdisk = 9;
  repeated string cdrom = 10;
  repeated string shared_dir = 11;
  string hostname = 12;
  repeated string network = 13;
  bool balloon = 14; 
  string bootloader = 15;
  string efi_vars = 16;
  string kernel = 18;
  string initrd = 19;
  repeated string params = 20;
  string escape_sequence = 21;
  string shutdown_timeout = 22;
}
