syntax = "proto3";

package sst.yaml.runctl.v1;

option go_package = "github.com/swiss-software-tool/runtime-smart/go/proto/yaml/runctl/v1;runctlpb";

message Instance {
  string api_version = 1; // "sst.io/v1"
  string kind        = 2; // "Instance"
  string name = 3;
  // Relative path of the image
  string image = 4;
  string boot = 5;
  string kernel = 6;
  string initrd = 7;
  string params = 8;
  int32 cpu_count = 9;
  string memory_size = 10;
  repeated Disk disks = 11;
  repeated Share shares = 12;
  Network network = 13;
  string efi_vars = 14;
  string hostname = 15;
  string rootfs_part_uuid = 16;
  string rootfs_type = 17; 
  string bootfs_part_uuid = 18;
  string bootfs_type = 19;
  string cidata = 20;
}
message Disk {
  string path = 1;  // e.g. data.img
  string mode = 2;  // "rw" or "ro"
}
message Share {
  string host  = 1;
  string guest = 2;
}
message Network {
  string mac = 1;
  string mode = 2;
  // Optional
  string hostname = 3;
}
