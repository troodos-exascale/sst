syntax = "proto3";

package sst.yaml.mkimage.v1;

option go_package = "github.com/swiss-software-tool/runtime-smart/go/proto/yaml/mkimage/v1;mkimagepb";

// ============================================================================
// Top-level image document
// ============================================================================

message ImageYAML {
   string name = 1;
   string upstream = 2;
   string retrieved_at = 3;
   string source_file_name = 4;
   string format = 5;
   string local_sha =6;

   string raw_image = 7;
   string kernel = 8;
   string initrd = 9;
   string rootfs_part_uuid = 10;
   string bootfs_part_uuid = 11;
   string rootfs_type = 12;
   string bootfs_type = 13;
}

